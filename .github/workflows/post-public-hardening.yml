name: Post-public hardening

on:
  public:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type harden-public-repository for a fresh fallback run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-public-hardening
  cancel-in-progress: false

jobs:
  validate:
    name: Validate post-public hardening source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLICATION_GITHUB_ACTOR_ID: ${{ github.actor_id }}
      PUBLICATION_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      PUBLICATION_GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      PUBLICATION_GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      PUBLICATION_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PUBLICATION_HARDENING_CONFIRMATION: ${{ inputs.confirmation || '' }}
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Validate the committed policy and invocation
        run: >-
          bun publication:harden-repository
          --operation validate-source

  apply-and-retire:
    name: Apply public policy and retire one-time authority
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLICATION_GITHUB_ACTOR_ID: ${{ github.actor_id }}
      PUBLICATION_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      PUBLICATION_GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      PUBLICATION_GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      PUBLICATION_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PUBLICATION_HARDENING_CONFIRMATION: ${{ inputs.confirmation || '' }}
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Apply, audit, and retire publication authority
        env:
          PUBLICATION_HARDENING_TOKEN: ${{ secrets.PUBLICATION_HARDENING_TOKEN }}
        run: >-
          bun publication:harden-repository
          --operation apply-and-retire
