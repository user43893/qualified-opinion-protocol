name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan / Gitleaks 8.30.1 exact-tree scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.12"

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_release="$(
            bash scripts/resolve-scanner-release.sh gitleaks
          )"
          IFS=$'\t' read -r archive_name archive_sha256 <<< "$scanner_release"
          test "$scanner_release" = "$archive_name"$'\t'"$archive_sha256"
          archive="$RUNNER_TEMP/$archive_name"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive_name"
          echo "$archive_sha256  $archive" \
            | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks-8.30.1"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/gitleaks-8.30.1" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" \
            >> "$GITHUB_ENV"

      - name: Verify scanner and scan the exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$("$GITLEAKS_BIN" version)" = "8.30.1"
          QUALIFIED_OPINION_GITLEAKS_BIN="$GITLEAKS_BIN" bun run gitleaks
